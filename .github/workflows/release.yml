name: Release · codeGem

# Fires on every human push to main.
# Skips bot-pushed version-bump commits ([skip ci]) to prevent loops.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Bump version, tag, create draft release ────────────────────────────
  prepare:
    name: Prepare release
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          node -e "
            const fs  = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            const [maj,min,pat] = pkg.version.split('.').map(Number);
            pkg.version = \`\${maj}.\${min}.\${pat+1}\`;
            fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
            console.log(pkg.version);
          " | tee /tmp/new_version
          VERSION=$(cat /tmp/new_version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

      - name: Commit version bump + tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main "${{ steps.bump.outputs.tag }}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes \
            --draft \
            --repo "${{ github.repository }}"

  # ── 2. Build binaries (macOS / Windows / Linux — parallel) ───────────────
  build:
    name: Build · ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Stamp version into package.json
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          "

      - name: Install Python setuptools (node-gyp/distutils fix for Python 3.12+)
        if: runner.os != 'Linux'
        shell: bash
        run: pip3 install setuptools --quiet

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build renderer + main + preload
        run: pnpm build

      - name: Package · macOS (arm64 + x64 DMG + zip)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never

      - name: Package · Windows (NSIS installer)
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --publish never

      - name: Package · Linux (AppImage + deb)
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux --publish never

      - name: Upload artifacts to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          REPO="${{ github.repository }}"
          shopt -s nullglob
          files=(
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          )
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$REPO"
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            dist/*.log
            dist/*.yml
          if-no-files-found: ignore

  # ── 3. Publish the release ────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Mark release as published + latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" \
            --draft=false \
            --latest \
            --repo "${{ github.repository }}"
