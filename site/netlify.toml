# Netlify config for the codeGem skills site.
# In the Netlify UI set "Base directory" to `site`; Netlify then reads this
# file from there and resolves `publish` relative to it. Netlify clones the
# whole repo, so the build can read ../.claude/skills/.

[build]
  command = "npm run build"
  publish = "dist"
  # Skip deploys when neither the site nor the skills changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../.claude/skills"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/install.*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/install-index.tsv"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/skills/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"
